<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة مزرعة الطيور الذكية المتصلة</title>
    <!-- استدعاء مكتبة سوبابيز الرسمية للربط -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef9f6;
            text-align: center;
            padding: 20px;
            color: #333;
        }
        .farm-container, .auth-container {
            background: white;
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .hidden { display: none; }
        .bird-icon {
            font-size: 80px;
            margin: 20px 0;
            display: inline-block;
            transition: transform 0.3s;
        }
        .dead { transform: rotate(90deg); filter: grayscale(100%); }
        .status-bar {
            background: #eee;
            border-radius: 10px;
            height: 20px;
            width: 100%;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress {
            background: #4caf50;
            height: 100%;
            width: 100%;
            transition: width 1s linear, background-color 0.5s;
        }
        button {
            background-color: #2196f3;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #0b7dda; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; box-shadow: none; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
        }
        .danger-text { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول وإنشاء الحساب -->
    <div id="auth-box" class="auth-container">
        <h2>مرحباً بك في المزرعة الذكية 🌾</h2>
        <p>ادخل اسم مستخدم فريد لتبدأ اللعب وحفظ أرباحك</p>
        <input type="text" id="username-input" placeholder="اكتب اسم المستخدم هنا...">
        <button onclick="loginOrRegister()">دخول / تسجيل حساب جديد</button>
        <p id="auth-msg" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- واجهة اللعبة والمزرعة الرئيسية -->
    <div id="game-box" class="farm-container hidden">
        <h2>مزرعتي المتصلة 🌾</h2>
        <p>اللاعب الحالي: <span id="current-user" style="font-weight: bold; color: #2196f3;">-</span></p>
        <p>رصيد الأرباح: <span id="balance">0.00000</span> USDT</p>
        
        <div id="bird" class="bird-icon">🐥</div>
        
        <p id="bird-status">حالة الطير: <span style="color: green; font-weight: bold;">نشيط وبصحة جيدة</span></p>
        <p>الطاقة المتبقية: <span id="timer" class="danger-text">100%</span></p>
        
        <div class="status-bar">
            <div id="energy-bar" class="progress"></div>
        </div>

        <button id="feed-btn" onclick="feedBird()">🌾 إطعام الطير (مشاهدة إعلان)</button>
        <button onclick="logout()" style="background-color: #777; font-size: 14px; padding: 5px; width: auto; border-radius: 5px;">تسجيل الخروج</button>
    </div>

    <script>
        // === إعدادات الربط الآمنة بقاعدة البيانات ===
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_aciq98AEwaOkrJ-KjH9SOw_8eB3TmKT";
        
        // تشغيل اتصال سوبابيز
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userId = null;
        let balance = 0.0;
        let energy = 100;
        let isDead = false;
        let gameLoopInterval = null;

        // وظيفة تسجيل الدخول أو إنشاء الحساب تلقائياً
        async function loginOrRegister() {
            const username = document.getElementById('username-input').value.trim();
            const msg = document.getElementById('auth-msg');
            if(!username) { msg.innerText = "الرجاء كتابة اسم المستخدم أولاً!"; return; }

            msg.style.color = "blue";
            msg.innerText = "جاري الفحص والاتصال بقاعدة البيانات...";

            try {
                // البحث عن المستخدم في الجدول
                let { data: users, error } = await _supabase.from('users_farm').select('*').eq('username', username);

                if(error) { msg.style.color = "red"; msg.innerText = "خطأ في الفحص: " + error.message; return; }

                if(users && users.length > 0) {
                    // المستخدم موجود مسبقاً، قم بتحميل بياناته
                    loadUserData(users[0]);
                } else {
                    // مستخدم جديد، قم بإنشائه في الجدول
                    let { data: newUser, error: createError } = await _supabase.from('users_farm').insert([{ username: username, balance: 0.0, energy: 100 }]).select();
                    if(createError) { msg.style.color = "red"; msg.innerText = "فشل إنشاء الحساب: " + createError.message; return; }
                    
                    if(newUser && newUser.length > 0) {
                        loadUserData(newUser[0]);
                    } else {
                        msg.style.color = "red"; msg.innerText = "فشل استرداد بيانات الحساب الجديد!";
                    }
                }
            } catch (e) {
                msg.style.color = "red";
                msg.innerText = "حدث خطأ غير متوقع: " + e.message;
            }
        }

        // تحميل بيانات اللاعب وعرض واجهة اللعبة
        function loadUserData(user) {
            currentUser = user.username;
            userId = user.id;
            balance = parseFloat(user.balance || 0);
            energy = parseInt(user.energy || 100);
            isDead = energy <= 0;

            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('game-box').classList.remove('hidden');
            document.getElementById('current-user').innerText = currentUser;
            document.getElementById('balance').innerText = balance.toFixed(5);
            
            updateUI();
            startGameLoop();
        }

        // محرك اللعبة الرئيسي (ينقص الطاقة ويزيد الأرباح ويحفظ في السيرفر كل 3 ثوانٍ)
        function startGameLoop() {
            if(gameLoopInterval) clearInterval(gameLoopInterval);

            gameLoopInterval = setInterval(async () => {
                if (!isDead) {
                    // إنقاص الطاقة تدريجياً
                    energy--;
                    if(energy <= 0) { energy = 0; isDead = true; }

                    // زيادة الأرباح طالما الطير حي
                    balance += 0.00005;

                    updateUI();
                    
                    // تحديث وحفظ البيانات في قاعدة بيانات سوبابيز فوراً
                    await _supabase.from('users_farm').update({ balance: balance, energy: energy }).eq('id', userId);
                } else {
                    clearInterval(gameLoopInterval);
                }
            }, 3000);
        }

        // تحديث عناصر الشاشة واجهات المستخدم
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(5);
            document.getElementById('timer').innerText = energy + '%';
            document.getElementById('energy-bar').style.width = energy + '%';

            // تلوين شريط الطاقة حسب الجوع
            if (energy > 50) document.getElementById('energy-bar').style.backgroundColor = '#4caf50';
            else if (energy > 20) document.getElementById('energy-bar').style.backgroundColor = '#ff9800';
            else document.getElementById('energy-bar').style.backgroundColor = '#f44336';

            if (isDead) {
                document.getElementById('bird').innerText = "💀";
                document.getElementById('bird').classList.add('dead');
                document.getElementById('bird-status').innerHTML = '<span class="danger-text">مات الطير بسبب الإهمال!</span>';
                document.getElementById('feed-btn').disabled = true;
            } else {
                document.getElementById('bird').innerText = "🐥";
                document.getElementById('bird').classList.remove('dead');
                document.getElementById('bird-status').innerHTML = '<span style="color: green; font-weight: bold;">نشيط وبصحة جيدة</span>';
                document.getElementById('feed-btn').disabled = false;
            }
        }

        // وظيفة زر الإطعام وإرجاع الطاقة لـ 100% وحفظها
        async function feedBird() {
            if (!isDead) {
                energy = 100;
                updateUI();
                alert("تم إطعام الطير بنجاح! وحفظ الطاقة 100% في قاعدة البيانات");
                await _supabase.from('users_farm').update({ energy: energy }).eq('id', userId);
            }
        }

        // تسجيل الخروج والعودة للقائمة
        function logout() {
            clearInterval(gameLoopInterval);
            document.getElementById('game-box').classList.add('hidden');
            document.getElementById('auth-box').classList.remove('hidden');
            document.getElementById('auth-msg').innerText = "";
            document.getElementById('username-input').value = "";
        }
    </script>
</body>
</html>
