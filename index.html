<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة مزرعة الطيور الذكية المتصلة</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef9f6;
            text-align: center;
            padding: 20px;
            color: #333;
        }
        .farm-container, .auth-container {
            background: white;
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .hidden { display: none; }
        .bird-icon {
            font-size: 80px;
            margin: 20px 0;
            display: inline-block;
            transition: transform 0.3s;
        }
        .dead { transform: rotate(90deg); filter: grayscale(100%); }
        .status-bar {
            background: #eee;
            border-radius: 10px;
            height: 20px;
            width: 100%;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress {
            background: #4caf50;
            height: 100%;
            width: 100%;
            transition: width 1s linear, background-color 0.5s;
        }
        button {
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-login { background-color: #2196f3; box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3); }
        .btn-login:hover { background-color: #0b7dda; }
        .btn-register { background-color: #4caf50; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3); }
        .btn-register:hover { background-color: #388e3c; }
        .btn-feed { background-color: #ff9800; font-size: 18px; box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3); }
        button:disabled { background-color: #cccccc; cursor: not-allowed; box-shadow: none; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
        }
        .danger-text { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-box" class="auth-container">
        <h2>مرحباً بك في المزرعة الذكية 🌾</h2>
        <p>اكتب اسم مستخدم بالإنجليزية لتبدأ</p>
        <input type="text" id="username-input" placeholder="اكتب اسم المستخدم هنا...">
        <button class="btn-login" onclick="loginExistingUser()">🔑 تسجيل دخول (لدي حساب سابق)</button>
        <button class="btn-register" onclick="registerNewUser()">✨ إنشاء حساب جديد (لاعب جديد)</button>
        <p id="auth-msg" style="color: blue; font-size: 14px; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div id="game-box" class="farm-container hidden">
        <h2>مزرعتي المتصلة 🌾</h2>
        <p>اللاعب الحالي: <span id="current-user" style="font-weight: bold; color: #2196f3;">-</span></p>
        <p>رصيد الأرباح: <span id="balance">0.00000</span> USDT</p>
        <div id="bird" class="bird-icon">🐥</div>
        <p id="bird-status">حالة الطير: <span style="color: green; font-weight: bold;">نشيط وبصحة جيدة</span></p>
        <p>الطاقة المتبقية: <span id="timer" class="danger-text">100%</span></p>
        <div class="status-bar">
            <div id="energy-bar" class="progress"></div>
        </div>
        <button id="feed-btn" class="btn-feed" onclick="feedBird()">🌾 إطعام الطير (مشاهدة إعلان)</button>
        <button onclick="logout()" style="background-color: #777; font-size: 12px; padding: 5px; width: auto; border-radius: 5px; margin-top: 20px;">تسجيل الخروج</button>
    </div>

    <script>
        const URL_DB = "https://supabase.co";
        const KEY_DB = "sb_publishable_aciq98AEwaOkrJ-KjH9SOw_8eB3TmKT";

        const supabaseClient = supabase.createClient(URL_DB, KEY_DB);

        let currentUser = null;
        let userId = null;
        let balance = 0.0;
        let energy = 100;
        let isDead = false;
        let gameLoopInterval = null;

        async function loginExistingUser() {
            const username = document.getElementById('username-input').value.trim();
            const msg = document.getElementById('auth-msg');
            if(!username) { msg.innerText = "الرجاء كتابة اسم المستخدم أولاً!"; return; }
            msg.style.color = "blue";
            msg.innerText = "جاري البحث عن حسابك في قاعدة البيانات...";
            try {
                let { data: users, error } = await supabaseClient.from('users_farm').select('*').eq('username', username);
                if(error) { msg.style.color = "red"; msg.innerText = "خطأ: " + error.message; return; }
                if(users && users.length > 0) {
                    loadUserData(users[0]); 
                } else {
                    msg.style.color = "orange";
                    msg.innerText = "هذا الحساب غير موجود! اضغط على زر إنشاء حساب جديد.";
                }
            } catch (e) {
                msg.style.color = "red";
                msg.innerText = "خطأ اتصال: " + e.message;
            }
        }

        async function registerNewUser() {
            const username = document.getElementById('username-input').value.trim();
            const msg = document.getElementById('auth-msg');
            if(!username) { msg.innerText = "الرجاء كتابة اسم المستخدم أولاً!"; return; }
            msg.style.color = "blue";
            msg.innerText = "جاري إنشاء وتأمين حسابك الجديد...";
            try {
                let { data: checkUsers } = await supabaseClient.from('users_farm').select('username').eq('username', username);
                if(checkUsers && checkUsers.length > 0) { msg.style.color = "orange"; msg.innerText = "هذا الاسم محجوز للاعب آخر! اختر اسماً مميزاً."; return; }
                
                let { data: newUser, error: createError } = await supabaseClient.from('users_farm').insert([{ username: username, balance: 0.0, energy: 100 }]).select();
                if(createError) { msg.style.color = "red"; msg.innerText = "فشل الإنشاء: " + createError.message; return; }
                if(newUser && newUser.length > 0) {
                    loadUserData(newUser[0]);
                } else {
                    msg.style.color = "green";
                    msg.innerText = "تم الإنشاء بنجاح! يرجى الضغط على زر تسجيل الدخول الآن للبدء.";
                }
            } catch (e) {
                msg.style.color = "red";
                msg.innerText = "خطأ غير متوقع: " + e.message;
            }
        }

        function loadUserData(user) {
            currentUser = user.username;
            userId = user.id;
            balance = parseFloat(user.balance || 0);
            energy = parseInt(user.energy || 100);
            isDead = energy <= 0;
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('game-box').classList.remove('hidden');
            document.getElementById('current-user').innerText = currentUser;
            document.getElementById('balance').innerText = balance.toFixed(5);
            updateUI();
            startGameLoop();
        }

        function startGameLoop() {
            if(gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(async () => {
                if (!isDead) {
                    energy--;
                    if(energy <= 0) { energy = 0; isDead = true; }
                    balance += 0.00005;
                    updateUI();
                    await supabaseClient.from('users_farm').update({ balance: balance, energy: energy }).eq('id', userId);
                } else {
                    clearInterval(gameLoopInterval);
                }
            }, 3000);
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(5);
            document.getElementById('timer').innerText = energy + '%';
            document.getElementById('energy-bar').style.width = energy + '%';
            if (energy > 50) document.getElementById('energy-bar').style.backgroundColor = '#4caf50';
            else if (energy > 20) document.getElementById('energy-bar').style.backgroundColor = '#ff9800';
            else document.getElementById('energy-bar').style.backgroundColor = '#f44336';
            
            if (isDead) {
                document.getElementById('bird').innerText = "💀";
                document.getElementById('bird').classList.add('dead');
                document.getElementById('bird-status').innerHTML = '<span class="danger-text">مات الطير بسبب الإهمال!</span>';
                document.getElementById('feed-btn').disabled = true;
            } else {
                document.getElementById('bird').innerText = "🐥";
                document.getElementById('bird').classList.remove('dead');
                document.getElementById('bird-status').innerHTML = '<span style="color: green; font-weight: bold;">نشيط وبصحة جيدة</span>';
                document.getElementById('feed-btn').disabled = false;
            }
        }

        async function feedBird() {
            if (!isDead) {
                energy = 100;
                updateUI();
                alert("تم إطعام الطير بنجاح! وحفظ الطاقة 100% في السيرفر");
                await supabaseClient.from('users_farm').update({ energy: energy }).eq('id', userId);
            }
        }

        function logout() {
            clearInterval(gameLoopInterval);
            document.getElementById('game-box').classList.add('hidden');
document.getElementById('auth-box').classList.remove('hidden');document.getElementById('auth-msg').innerText = "";document.getElementById('username-input').value = "";}
